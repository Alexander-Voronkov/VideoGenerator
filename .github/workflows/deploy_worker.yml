name: Deploy .NET App via SSH (Rebuild Container)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy updated source code to remote server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.VM_SECRET_KEY }}
          source: "."
          target: "~/videogenerator-src"

      - name: Rebuild and restart container on remote server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.VM_SECRET_KEY }}
          port: 22
          script: |
            echo "🚀 Starting deploy on $(hostname)"
            cd ~/videogenerator-src

            echo "🔨 Rebuilding Docker image..."
            sudo docker build -t videogenerator:latest .

            if sudo docker ps -q -f name=videogenerator > /dev/null; then
              echo "♻️ Restarting existing container..."
              sudo docker stop videogenerator
              sudo docker rm videogenerator
            else
              echo "🆕 No existing container found, creating new one..."
            fi

            echo "🔥 Running updated container..."
            sudo docker run -d \
              --name videogenerator \
              --restart always \
              -e DOTNET_ENVIRONMENT=Production \
              videogenerator:latest

            echo "✅ Deploy complete!"
