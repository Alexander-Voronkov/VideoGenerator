name: Deploy .NET App via SSH (Build on Server)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy source code to remote server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.VM_SECRET_KEY }}
          source: "."
          target: "~/videogenerator-src"

      - name: Build and run Docker container on remote server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.VM_SECRET_KEY }}
          port: 22
          script: |
            echo "🚀 Starting deploy on $(hostname)"
            cd ~/videogenerator-src

            echo "🧹 Cleaning up old containers..."
            sudo docker stop videogenerator || true
            sudo docker rm videogenerator || true

            echo "🔨 Building Docker image on remote server..."
            sudo docker build -t videogenerator:latest .

            echo "🔥 Running container..."
            sudo docker run -d \
              --name videogenerator \
              --restart always \
              -e DOTNET_ENVIRONMENT=Production \
              videogenerator:latest

            echo "✅ Deploy complete!"
